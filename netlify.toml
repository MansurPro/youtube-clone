[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 8 (rolldown) imports styleText from node:util, which needs Node 20.12+.
  # Netlify's default is still 18, which fails at import with a SyntaxError.
  NODE_VERSION = "22"

# Must come before the SPA catch-all below: first matching rule wins, so a
# greedy /* would otherwise swallow the API calls and return index.html.
[[redirects]]
  from = "/api/youtube/*"
  to = "/.netlify/functions/youtube/:splat"
  status = 200

# react-router resolves /video/:id etc. client-side, so every other path must
# serve index.html or a hard refresh / shared deep link 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
